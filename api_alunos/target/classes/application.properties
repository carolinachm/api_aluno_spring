spring.application.name=api_alunos

# ==============================================
# 🔗 CONEXÃO COM O BANCO DE DADOS POSTGRESQL
# ==============================================
# URL do banco: jdbc:postgresql://servidor:porta/nome_do_banco
spring.datasource.url=jdbc:postgresql://localhost:5432/api_alunos_db

# Usuário e senha do PostgreSQL
spring.datasource.username=postgres
spring.datasource.password=postgres

# Driver do PostgreSQL (não precisa mudar)
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================
# 🗄️ CONFIGURAÇÃO JPA / HIBERNATE
# ==============================================
# Estratégia de criação/atualização das tabelas
# opções: none | update | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Mostrar comandos SQL no console (true = sim, false = não)
spring.jpa.show-sql=true

# Formatar o SQL exibido para ficar mais legível
spring.jpa.properties.hibernate.format_sql=true

# Dialeto → instrui Hibernate a gerar SQL compatível com PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================================
# ⚙️ CONFIGURAÇÕES EXTRAS (opcionais)
# ==============================================
# Codificação
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Porta da aplicação (padrão 8080 — pode alterar se precisar)
server.port=8080